[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-kit"
version = "2.0.0"
description = "The simplest GGUF quantization pipeline for HuggingFace models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Dhruval Patel" }]
keywords = ["gguf", "quantization", "llm", "llama-cpp", "huggingface", "machine-learning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "huggingface_hub>=0.23.0",
    "transformers>=4.40.0",
    "torch>=2.3.0",
    "psutil>=5.9.0",
    "jinja2>=3.1.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
quant-kit = "quantize:main"

[project.urls]
Homepage = "https://github.com/DhruvalPtl/quant-kit"
Issues = "https://github.com/DhruvalPtl/quant-kit/issues"
